name: Apply staged session patch

on:
  push:
    branches: [apply-session-changes-20261001]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: apply-session-changes-20261001

      - name: Apply changes
        run: python .tmp/apply_changes.py

      - name: Commit final changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Improve campaign member invites and username handling'
          git push origin HEAD:apply-session-changes-20261001
