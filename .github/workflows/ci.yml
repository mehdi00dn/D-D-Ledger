name: CI

on:
  push:
    branches: [main, vercel]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Compile Python modules
        run: python -m compileall -q app.py api database.py migrate.py

      - name: Run test suite
        env:
          LEDGER_TEST_BACKEND: postgres
          TEST_PG_ADMIN: host=localhost port=5432 user=postgres password=postgres dbname=postgres
          SECRET_KEY: ci-only-secret
        run: python -m pytest tests -q