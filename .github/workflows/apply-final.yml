name: Apply final session changes
on:
  push:
    branches: [apply-session-changes-20261001]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: apply-session-changes-20261001
      - run: python .tmp/apply_changes.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Apply session changes'
          git push origin HEAD:apply-session-changes-20261001
