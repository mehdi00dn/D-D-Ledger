<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Log In — Campaign Ledger</title>
<script nonce="{{ csp_nonce() }}">
  (function () {
    var saved = localStorage.getItem('ledger-theme');
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<link rel="icon" href="{{ url_for('static', filename='logo/favicon.ico') }}" sizes="any">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="form-panel auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><img src="{{ url_for('static', filename='logo/logo-128.png') }}" alt=""></span>
      <span class="brand-text">
        <span class="brand-title">Campaign</span>
        <span class="brand-subtitle">Ledger</span>
      </span>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    {% if error %}<p class="auth-error" role="alert" id="auth-error">{{ error }}</p>{% endif %}
    <form method="POST" class="auth-form">{{ csrf_field() }}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username }}" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false"{% if error %} aria-describedby="auth-error"{% endif %}>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <div class="field" style="margin-top:14px;">
        <label class="field-checkbox">
          <input type="checkbox" name="remember" checked>
          Remember me
        </label>
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Log In</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register', next=next) if next else url_for('register') }}">Create an account</a></p>
  </div>
</div>
</body>
</html>
