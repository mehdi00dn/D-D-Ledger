<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Reset password — Campaign Ledger</title>
<script nonce="{{ csp_nonce() }}">
  (function () {
    var saved = localStorage.getItem('ledger-theme');
    if (saved === 'system') saved = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    if (saved === 'light' || saved === 'dark') {
      document.documentElement.setAttribute('data-theme', saved);
    }
  })();
</script>
<link rel="icon" href="{{ url_for('static', filename='logo/favicon.ico') }}" sizes="any">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-page">
  <div class="form-panel auth-card">
    <div class="auth-brand">
      <span class="brand-mark"><img src="{{ url_for('static', filename='logo/logo-128.png') }}" alt=""></span>
      <span class="brand-text">
        <span class="brand-title">Campaign</span>
        <span class="brand-subtitle">Ledger</span>
      </span>
    </div>
    <h1 class="auth-title">Choose a new password</h1>
    {% if invalid %}
    <p class="auth-error" role="alert" id="auth-error">This reset link is not valid any more. It may have expired or already been used.</p>
    <p class="auth-switch"><a href="{{ url_for('forgot_password') }}">Send a new link</a></p>
    {% else %}
    {% if error %}<p class="auth-error" role="alert" id="auth-error">{{ error }}</p>{% endif %}
    <form method="POST" class="auth-form" data-once>{{ csrf_field() }}
      <div class="field" style="margin-bottom:14px;">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8" maxlength="128" autofocus autocomplete="new-password">
        <p class="hint-text">At least 8 characters.</p>
      </div>
      <div class="field">
        <label for="confirm_password">Repeat new password</label>
        <input type="password" id="confirm_password" name="confirm_password" required minlength="8" maxlength="128" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary auth-submit">Set new password</button>
    </form>
    {% endif %}
  </div>
</div>
</body>
</html>
